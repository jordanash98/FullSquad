workflows:
  ios-capacitor:
    name: Full Squad iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          npx cap add ios
          npx cap sync ios
    artifacts:
      - ios/App/build/**/*.ipa
      - ios/App/build/**/*.xcarchive
